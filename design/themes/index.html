<title>Melofy Havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Baloo+2:wght@500;700;800&family=Chakra+Petch:wght@400;600;700&family=DotGothic16&family=Pixelify+Sans:wght@400;600&family=Silkscreen&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --page:#0d0b1c; --page-2:#16122e; --text:#ecebf7; --muted:#a19fc0; --line:rgba(255,255,255,.1);
  --pick:#7df3ff;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,var(--page-2),var(--page) 70%) fixed,var(--page);color:var(--text);
  font:15px/1.5 "Pixelify Sans",system-ui,sans-serif;padding-inline:16px;transition:background .6s}
.wrap{max-width:1560px;margin:0 auto;padding-block:28px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 32px;margin-bottom:20px}
.brand{font-family:"Silkscreen",monospace;font-size:clamp(28px,5vw,44px);line-height:1;letter-spacing:.02em;margin:0}
.brand small{display:block;font-family:"Pixelify Sans",sans-serif;font-size:15px;color:var(--muted);letter-spacing:0;margin-top:8px}
.note{color:var(--muted);max-width:52ch;margin:0;font-size:14px}

/* theme picker = the four havens compared */
.havens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:34px}
@media (max-width:820px){.havens{grid-template-columns:repeat(2,minmax(0,1fr))}}
.haven{all:unset;cursor:pointer;position:relative;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:10px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);transition:border-color .2s,background .2s,transform .2s}
.haven:hover{background:rgba(255,255,255,.06);transform:translateY(-2px)}
.haven:focus-visible{outline:2px solid var(--pick);outline-offset:3px}
.haven[aria-pressed="true"]{border-color:var(--hc);background:color-mix(in srgb,var(--hc) 10%,transparent);box-shadow:0 0 28px -8px var(--hc)}
.haven img{width:72px;height:150px;object-fit:cover;border-radius:8px;image-rendering:pixelated}
.haven b{display:block;font-size:17px}
.haven span{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.haven .sw{display:flex;gap:4px;margin-top:8px}
.haven .sw i{width:14px;height:14px;border-radius:3px}
@media (max-width:480px){.haven{grid-template-columns:1fr}.haven img{width:100%;height:120px}}

.theme-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;margin-bottom:14px}
.theme-head h2{margin:0;font-size:24px;font-weight:600}
.theme-head p{margin:0;color:var(--muted);font-size:14px}
.rail{overflow-x:auto;padding:14px 4px 22px;scroll-snap-type:x mandatory}
.screens{display:flex;gap:26px;width:max-content;margin:0 auto}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;scroll-snap-align:center}
.col figcaption{font-size:13px;color:var(--muted);font-family:"Silkscreen",monospace;letter-spacing:.04em}

/* ---------- phone ---------- */
.phone{width:288px;height:600px;border-radius:44px;padding:9px;background:linear-gradient(145deg,#2a2833,#0c0b10);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08) inset;flex:none}
.scr{--r:12px;position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;color:var(--ink);font-family:var(--body);isolation:isolate}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated;z-index:-2}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--veil-a),var(--veil-b) 55%,var(--veil-c))}
.hub .veil{background:linear-gradient(180deg,var(--hveil-a),transparent 28%,transparent 62%,var(--hveil-b))}
.status{display:flex;justify-content:space-between;padding:12px 24px 0;font:600 11px/1 var(--label);letter-spacing:.06em;opacity:.85}
.notch{position:absolute;top:8px;left:50%;translate:-50% 0;width:84px;height:22px;border-radius:12px;background:#000;z-index:5}
.body{position:absolute;inset:38px 14px 14px;display:flex;flex-direction:column;gap:10px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
  -webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px -12px rgba(0,0,0,.5),0 0 22px -6px var(--glow)}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 10px}
.hdr img{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 0 8px var(--glow))}
.hdr b{display:block;font-family:var(--display);font-size:18px;line-height:1.1}
.hdr small{display:block;font:11px/1.2 var(--label);opacity:.75;letter-spacing:.04em}
.back{margin-left:auto;font:11px var(--label);opacity:.7;white-space:nowrap}
.lbl{font:11px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.glow{color:var(--accent);text-shadow:0 0 12px var(--accent),0 0 2px var(--accent)}
button.ctl{all:unset;cursor:pointer;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--edge);background:var(--chip);font:600 14px var(--body);color:var(--ink);transition:transform .12s, box-shadow .2s}
button.ctl:hover{box-shadow:0 0 16px -4px var(--accent)}
button.ctl:active{transform:scale(.95)}
button.ctl:focus-visible,.hot:focus-visible,.chord:focus-visible,.str:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hub */
.hub .title{text-align:center;margin-top:10px}
.hub .title h3{margin:0;font:700 30px/1 var(--display);letter-spacing:.02em;text-shadow:0 0 18px var(--glow)}
.hub .title p{margin:4px 0 0;font:12px var(--label);opacity:.85}
.hot{all:unset;cursor:pointer;position:absolute;translate:-50% -50%;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0 30%,transparent 32%);box-shadow:0 0 0 2px var(--accent),0 0 18px var(--accent);animation:pulse 2.2s ease-in-out infinite}
.hot span{position:absolute;left:50%;bottom:130%;translate:-50% 0;white-space:nowrap;font:600 10px/1 var(--label);padding:4px 6px;border-radius:6px;background:var(--glass-strong);border:1px solid var(--edge);opacity:0;transition:opacity .2s}
.hot:hover span,.hot:focus-visible span{opacity:1}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent,0 0 26px var(--accent);scale:1.12}}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 6px}
.dock button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:10px/1.1 var(--label);text-align:center;border-radius:10px;padding:2px}
.dock button:focus-visible{outline:2px solid var(--accent)}
.dock img{width:46px;height:46px;image-rendering:pixelated;transition:transform .2s, filter .2s}
.dock button:hover img{transform:translateY(-3px);filter:drop-shadow(0 0 10px var(--accent))}
.streak{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12px}
.streak b{font-family:var(--display);font-size:16px}

/* metronome */
.bpm{text-align:center;padding:14px 8px 10px}
.bpm .n{font:700 76px/1 var(--display);font-variant-numeric:tabular-nums}
.bpm .it{font:13px var(--label);opacity:.9;margin-top:4px}
.beats{display:flex;justify-content:center;gap:12px;margin-top:12px}
.beats i{width:16px;height:16px;border-radius:var(--dot);border:2px solid var(--accent);opacity:.45;transition:background .06s,opacity .06s,box-shadow .06s}
.beats i.on{background:var(--accent);opacity:1;box-shadow:0 0 16px var(--accent)}
.beats i.first{border-color:var(--accent2)}
.beats i.first.on{background:var(--accent2);box-shadow:0 0 16px var(--accent2)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.ctlrow{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.ctlrow .ctl{height:48px;font-size:20px}
.play{height:58px!important;font-size:15px!important;background:linear-gradient(135deg,var(--accent),var(--accent2))!important;color:var(--on-accent)!important;border:none!important;box-shadow:0 0 24px -4px var(--accent)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.opt{text-align:center;padding:6px 2px;border-radius:calc(var(--r) - 4px);font-size:12px}
.opt b{display:block;font-family:var(--display);font-size:16px}
.opt.sel{background:var(--chip);box-shadow:inset 0 0 0 1px var(--accent)}

/* tuner */
.gauge{padding:10px 8px 6px;text-align:center}
.gauge svg{width:100%;height:auto;display:block;overflow:visible}
.gauge .nn{font:700 64px/1 var(--display);margin-top:-44px}
.gauge .hz{font:13px var(--label);opacity:.85;font-variant-numeric:tabular-nums}
.state{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;font:600 11px var(--label);letter-spacing:.06em;background:var(--chip);border:1px solid var(--edge)}
.state.ok{color:var(--good);border-color:var(--good);box-shadow:0 0 14px -4px var(--good)}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:8px}
.str{all:unset;cursor:pointer;text-align:center;padding:8px 0;border-radius:calc(var(--r) - 4px);font:700 15px var(--display)}
.str small{display:block;font:9px var(--label);opacity:.7}
.str.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 0 16px -4px var(--accent)}
.sample{font:10px var(--label);opacity:.6;text-align:center}

/* chords */
.keys{display:flex;gap:5px;padding:6px;overflow:hidden}
.keys span{flex:1;text-align:center;font:600 12px var(--label);padding:5px 0;border-radius:calc(var(--r) - 4px)}
.keys span.sel{background:var(--chip);box-shadow:inset 0 0 0 1px var(--accent)}
.diagram{display:grid;grid-template-columns:118px 1fr;gap:6px;padding:10px;align-items:center}
.diagram svg{width:118px;height:auto}
.diagram h4{margin:0;font:700 34px/1 var(--display)}
.diagram p{margin:4px 0 0;font:11px/1.4 var(--label);opacity:.85}
.notes{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.notes i{font-style:normal;font:700 12px var(--display);padding:3px 7px;border-radius:99px;border:1px solid var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.chord{all:unset;cursor:pointer;text-align:center;padding:9px 0;border-radius:calc(var(--r) - 4px);font:700 15px var(--display);background:var(--chip);border:1px solid transparent}
.chord.sel{border-color:var(--accent);box-shadow:0 0 14px -4px var(--accent);color:var(--accent)}
.scale{padding:8px 10px}
.scale .deg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.scale .deg span{text-align:center;font:600 12px var(--display);padding:4px 0;border-radius:6px;background:var(--chip)}
.scale .deg span.r{background:var(--accent);color:var(--on-accent)}

/* diary */
.week{padding:10px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:86px;margin-top:8px;position:relative}
.bars .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--accent2);opacity:.8}
.bars div{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bars b{width:100%;border-radius:4px 4px 2px 2px;background:linear-gradient(0deg,var(--accent2),var(--accent));box-shadow:0 0 10px -3px var(--accent);min-height:2px}
.bars b.zero{background:var(--chip);box-shadow:none}
.bars span{font:10px var(--label);opacity:.8}
.bars div.today span{color:var(--accent);opacity:1}
.sum{display:flex;justify-content:space-between;margin-top:8px;font-size:12px}
.sum b{font-family:var(--display);font-size:15px}
.plan{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.chk{all:unset;cursor:pointer;display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 2px}
.chk i{width:16px;height:16px;border-radius:var(--dot);border:2px solid var(--accent)}
.chk[aria-checked="true"] i{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.chk[aria-checked="true"] span{opacity:.55;text-decoration:line-through}
.chk em{font-style:normal;font:10px var(--label);opacity:.7}
.entry{padding:9px 11px;font-size:12.5px;line-height:1.45}
.entry .lbl{display:block;margin-bottom:4px}

/* ---------- per-theme identity ---------- */
.t-space{--display:"Chakra Petch",sans-serif;--body:"Chakra Petch",sans-serif;--label:"Silkscreen",monospace;
  --ink:#eaf1ff;--accent:#7df3ff;--accent2:#b58cff;--on-accent:#0b0a24;--good:#8dffb8;
  --glass:rgba(18,16,58,.42);--glass-strong:rgba(18,16,58,.85);--edge:rgba(125,243,255,.35);--glow:rgba(125,243,255,.35);--chip:rgba(125,243,255,.08);
  --veil-a:rgba(10,8,40,.55);--veil-b:rgba(20,10,60,.35);--veil-c:rgba(6,4,24,.85);--hveil-a:rgba(6,4,30,.7);--hveil-b:rgba(6,4,30,.85);--dot:2px}
.t-space .scr{--r:4px}
.t-space .glass{position:relative}
.t-space .glass::before,.t-space .glass::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--accent);pointer-events:none;filter:drop-shadow(0 0 4px var(--accent))}
.t-space .glass::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.t-space .glass::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.t-space .scr::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}

.t-forest{--display:"Alegreya",serif;--body:"Alegreya",serif;--label:"Pixelify Sans",sans-serif;
  --ink:#fff3d9;--accent:#ffc861;--accent2:#9fdc6e;--on-accent:#2b1a08;--good:#b9f07f;
  --glass:rgba(48,28,12,.5);--glass-strong:rgba(48,28,12,.9);--edge:rgba(255,200,97,.3);--glow:rgba(255,190,80,.35);--chip:rgba(255,220,150,.1);
  --veil-a:rgba(20,14,6,.55);--veil-b:rgba(30,20,8,.35);--veil-c:rgba(14,10,4,.88);--hveil-a:rgba(8,14,10,.65);--hveil-b:rgba(20,12,4,.85);--dot:50%}
.t-forest .scr{--r:14px}
.t-forest .glass{box-shadow:inset 0 0 0 3px rgba(40,22,8,.35),inset 0 0 0 4px rgba(255,200,97,.18),0 10px 30px -12px rgba(0,0,0,.6),0 0 26px -8px var(--glow)}
.t-forest .fly{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3a0;box-shadow:0 0 8px 2px #ffe66b;z-index:3;pointer-events:none;animation:drift 7s ease-in-out infinite}
@keyframes drift{0%,100%{translate:0 0;opacity:.2}50%{translate:14px -22px;opacity:1}}

.t-ocean{--display:"Baloo 2",sans-serif;--body:"Baloo 2",sans-serif;--label:"Baloo 2",sans-serif;
  --ink:#e6fbff;--accent:#5ff5e5;--accent2:#ff7fd8;--on-accent:#04203a;--good:#7dffc4;
  --glass:rgba(10,60,130,.28);--glass-strong:rgba(8,40,90,.85);--edge:rgba(160,250,255,.35);--glow:rgba(95,245,229,.4);--chip:rgba(160,250,255,.1);
  --veil-a:rgba(2,20,60,.5);--veil-b:rgba(4,30,80,.3);--veil-c:rgba(2,12,40,.85);--hveil-a:rgba(2,16,50,.6);--hveil-b:rgba(4,10,40,.8);--dot:50%}
.t-ocean .scr{--r:22px}
.t-ocean .lbl{text-transform:none;letter-spacing:.02em;font-weight:600}
.t-ocean .bub{position:absolute;bottom:-12px;border-radius:50%;border:1px solid rgba(200,255,255,.6);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 45%);z-index:3;pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{translate:0 -640px}}

.t-sky{--display:"Zen Maru Gothic",sans-serif;--body:"Zen Maru Gothic",sans-serif;--label:"DotGothic16",monospace;
  --ink:#4a1f4f;--accent:#ec4f7c;--accent2:#a672ff;--on-accent:#fff;--good:#2f9e6b;
  --glass:rgba(255,244,252,.5);--glass-strong:rgba(255,244,252,.92);--edge:rgba(255,255,255,.75);--glow:rgba(255,160,200,.45);--chip:rgba(255,255,255,.45);
  --veil-a:rgba(255,220,240,.35);--veil-b:rgba(255,230,245,.15);--veil-c:rgba(250,210,240,.6);--hveil-a:rgba(255,230,245,.55);--hveil-b:rgba(250,210,240,.65);--dot:50%}
.t-sky .scr{--r:26px}
.t-sky .glass{box-shadow:inset 0 1px 0 #fff,0 10px 30px -10px rgba(150,60,140,.35),0 0 30px -6px var(--glow)}
.t-sky .glow{color:var(--accent);text-shadow:0 0 14px rgba(255,122,156,.6)}
.t-sky .bg{animation:float 9s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Melofy Havens<small>Four very different safe places for the same four tools</small></h1>
    <p class="note">Pick a haven to see all five screens in it. The metronome plays sound, and the tuner, chords and practice checklist respond to taps. The tuner shows a sample reading because the microphone isn't available here.</p>
  </header>
  <nav class="havens" id="havens" aria-label="Choose a haven"></nav>
  <section>
    <div class="theme-head"><h2 id="tname"></h2><p id="tdesc"></p></div>
    <div class="rail"><div class="screens" id="screens"></div></div>
  </section>
</div>

  D:["xx0232","D F♯ A","Major · sparkling"],E7:["020100","E G♯ B D","Dominant 7 · wants to resolve"]};
const STRINGS=[["E",82.41,"6th"],["A",110.00,"5th"],["D",146.83,"4th"],["G",196.00,"3rd"],["B",246.94,"2nd"],["E",329.63,"1st"]];
const WEEK=[["M",20],["T",35],["W",0],["T",45],["F",30],["S",50],["S",25]];
const $=s=>document.querySelector(s);
let cur="space",metro=null,tunerRAF=null;
const save=k=>{try{localStorage.setItem("melofy-haven",k)}catch(e){}};
try{const s=localStorage.getItem("melofy-haven");if(THEMES[s])cur=s}catch(e){}
const hash=location.hash.slice(1);if(THEMES[hash])cur=hash;

function havens(){
  $("#havens").innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="haven" data-k="${k}" style="--hc:${t.sw[0]}" aria-pressed="${k===cur}">
    <img src="img/${k}-hub.png" alt="">
    <div><b>${t.name}</b><span>${t.desc.split(".")[0]}.</span><div class="sw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</div></div></button>`).join("");
  $("#havens").onclick=e=>{const b=e.target.closest(".haven");if(b){cur=b.dataset.k;save(cur);render()}};
}

const shell=(k,t,cls,bg,inner,extra="")=>`<figure class="col" style="margin:0"><div class="phone"><div class="scr ${cls}" id="p-${cls}">
  <div class="bg" style="background-image:url(img/${bg}.png)"></div><div class="veil"></div><div class="notch"></div>${extra}
  <div class="status"><span>${t.time}</span><span>${t.sig}</span></div><div class="body">${inner}</div></div></div>
  <figcaption>${LABELS[cls]}</figcaption></figure>`;
const hdr=(k,t,key,sub)=>`<div class="glass hdr"><img src="img/${k}-${key}.png" alt=""><div><b>${t.tools[key]}</b><small>${sub}</small></div><span class="back">‹ home</span></div>`;

function ambient(k){
  if(k==="forest")return Array.from({length:9},(_,i)=>`<i class="fly" style="left:${8+i*10}%;top:${12+(i*37)%70}%;animation-delay:${-i*0.8}s"></i>`).join("");
  if(k==="ocean")return Array.from({length:8},(_,i)=>{const s=4+(i*5)%9;return `<i class="bub" style="left:${6+i*12}%;width:${s}px;height:${s}px;animation-duration:${9+(i*3)%7}s;animation-delay:${-i*1.7}s"></i>`}).join("");
  return "";
}

function screens(k,t){
  const hub=shell(k,t,"hub",`${k}-hub`,`
    <div class="title"><h3 class="glow">Melofy</h3><p>${t.greet}</p></div>
    ${KEYS.map(key=>`<button class="hot" style="left:${t.hot[key][0]}%;top:${t.hot[key][1]}%" data-go="${key}" aria-label="Open ${t.tools[key]}"><span>${t.tools[key]}</span></button>`).join("")}
    <div class="glass streak" style="margin-top:auto"><span>${t.streak}</span><b class="glow">6</b><span>Today · 25 of 30 min</span></div>
    <div class="glass dock">${KEYS.map(key=>`<button data-go="${key}"><img src="img/${k}-${key}.png" alt="">${t.tools[key]}</button>`).join("")}</div>`,ambient(k));
  const metro=shell(k,t,"metronome",`${k}-alt`,`
    ${hdr(k,t,"metronome","Metronome")}
    <div class="glass bpm"><div class="lbl">tempo · bpm</div><div class="n glow" id="bpmN">92</div><div class="it" id="bpmIt">Andante · 4/4</div>
      <div class="beats" id="beats"><i class="first"></i><i></i><i></i><i></i></div></div>
    <div class="ctlrow"><button class="ctl" id="bDn" aria-label="Slower">−</button><button class="ctl play" id="bPlay">${t.play}</button><button class="ctl" id="bUp" aria-label="Faster">+</button></div>
    <div class="glass opts"><div class="opt sel"><b>4/4</b>time</div><div class="opt"><b>♪</b>subdiv</div><div class="opt"><b>tap</b>tempo</div></div>
    <div class="glass entry" style="margin-top:auto"><span class="lbl">Goal</span>Reach 100 BPM clean on the F–C change</div>`,ambient(k));
  const tuner=shell(k,t,"tuner",`${k}-alt`,`
    ${hdr(k,t,"tuner","Tuner · EADGBE")}
    <div class="glass gauge"><svg viewBox="0 0 220 120" aria-hidden="true">
      <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="var(--edge)" stroke-width="10" stroke-linecap="round"/>
      <path d="M92 22 A90 90 0 0 1 128 22" fill="none" stroke="var(--good)" stroke-width="10" stroke-linecap="round" opacity=".8"/>
      ${Array.from({length:11},(_,i)=>{const a=Math.PI*(1-i/10),x1=110+78*Math.cos(a),y1=110-78*Math.sin(a),x2=110+70*Math.cos(a),y2=110-70*Math.sin(a);return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink)" stroke-opacity=".5" stroke-width="2"/>`}).join("")}
      <g id="needle" style="transform-origin:110px 110px"><line x1="110" y1="110" x2="110" y2="30" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 4px var(--accent))"/><circle cx="110" cy="110" r="6" fill="var(--accent)"/></g>
    </svg><div class="nn glow" id="tNote">A</div><div class="hz" id="tHz">110.0 Hz · −2 cents</div><div class="state" id="tState">Almost there</div></div>
    <div class="glass strings" id="strs">${STRINGS.map((s,i)=>`<button class="str${i===1?" sel":""}" data-i="${i}">${s[0]}<small>${s[2]}</small></button>`).join("")}</div>
    <p class="sample">Sample reading · A = 440 Hz</p>`,ambient(k));
  const chords=shell(k,t,"chords",`${k}-alt`,`
    ${hdr(k,t,"chords","Chords &amp; scales")}
    <div class="glass keys">${["C","G","D","A","E","F"].map((n,i)=>`<span class="${i?"":"sel"}">${n}</span>`).join("")}</div>
    <div class="glass diagram"><svg id="cDia" viewBox="0 0 118 130" aria-hidden="true"></svg><div><h4 class="glow" id="cName">C</h4><p id="cDesc"></p><div class="notes" id="cNotes"></div></div></div>
    <div class="glass grid" id="cGrid">${Object.keys(CHORDS).map((c,i)=>`<button class="chord${i?"":" sel"}" data-c="${c}">${c}</button>`).join("")}</div>
    <div class="glass scale"><span class="lbl">C major scale</span><div class="deg">${"C D E F G A B".split(" ").map((n,i)=>`<span class="${i?"":"r"}">${n}</span>`).join("")}</div></div>`,ambient(k));
  const max=60;
  const diary=shell(k,t,"diary",`${k}-alt`,`
    ${hdr(k,t,"diary","This week")}
    <div class="glass week"><span class="lbl">minutes practised</span>
      <div class="bars"><i class="goal" style="bottom:${16+30/max*70}px"></i>${WEEK.map(([d,m],i)=>`<div class="${i===6?"today":""}"><b class="${m?"":"zero"}" style="height:${Math.max(m/max*70,2)}px"></b><span>${d}</span></div>`).join("")}</div>
      <div class="sum"><span>Total <b class="glow">3h 25m</b></span><span>Goal 30 min / day</span></div></div>
    <div class="glass plan" id="plan"><span class="lbl">Today's plan</span>
      ${[["Warm-up: C major scale","10 min",1],["Metronome: F–C at 92 BPM","15 min",1],["Song: “Riptide” verse","10 min",0],["Tune up and record a take","5 min",0]].map(([a,b,c])=>`<button class="chk" role="checkbox" aria-checked="${!!c}"><i></i><span>${a}</span><em>${b}</em></button>`).join("")}</div>
    <div class="glass entry"><span class="lbl">Tonight's note</span>${t.entry}</div>`,ambient(k));
  return hub+metro+tuner+chords+diary;
}

function drawChord(c){
  const [shape,notes,desc]=CHORDS[c],x0=14,dx=18,y0=22,dy=24;
  let s=`<rect x="${x0}" y="${y0-3}" width="${dx*5}" height="4" fill="var(--ink)" rx="1"/>`;
  for(let f=1;f<=4;f++)s+=`<line x1="${x0}" x2="${x0+dx*5}" y1="${y0+f*dy}" y2="${y0+f*dy}" stroke="var(--ink)" stroke-opacity=".45"/>`;
  for(let i=0;i<6;i++)s+=`<line x1="${x0+i*dx}" x2="${x0+i*dx}" y1="${y0}" y2="${y0+4*dy}" stroke="var(--ink)" stroke-opacity=".7"/>`;
  if(c==="F")s+=`<rect x="${x0-6}" y="${y0+dy/2-6}" width="${dx*5+12}" height="12" rx="6" fill="var(--accent)" style="filter:drop-shadow(0 0 5px var(--accent))"/>`;
  [...shape].forEach((ch,i)=>{const x=x0+i*dx;
    if(ch==="x")s+=`<text x="${x}" y="${y0-8}" text-anchor="middle" font-size="11" fill="var(--ink)" opacity=".7">×</text>`;
    else if(ch==="0")s+=`<circle cx="${x}" cy="${y0-11}" r="4" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    else if(!(c==="F"&&ch==="1"))s+=`<circle cx="${x}" cy="${y0+(+ch-.5)*dy}" r="7" fill="var(--accent)" style="filter:drop-shadow(0 0 5px var(--accent))"/>`;});
  $("#cDia").innerHTML=s;$("#cName").textContent=c;$("#cDesc").textContent=desc;
  $("#cNotes").innerHTML=notes.split(" ").map(n=>`<i>${n}</i>`).join("");
}

function tempoName(b){return b<60?"Largo":b<76?"Adagio":b<108?"Andante":b<120?"Moderato":b<168?"Allegro":"Presto"}

function wireMetronome(t){
  let bpm=92,beat=0,ctx=null,timer=null;
  const upd=()=>{$("#bpmN").textContent=bpm;$("#bpmIt").textContent=tempoName(bpm)+" · 4/4"};
  const dots=[...document.querySelectorAll("#beats i")];
  const tick=()=>{dots.forEach((d,i)=>d.classList.toggle("on",i===beat));
    if(ctx){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=beat?880:1320;g.gain.setValueAtTime(.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.06);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.07)}
    beat=(beat+1)%4};
  const stop=()=>{clearInterval(timer);timer=null;dots.forEach(d=>d.classList.remove("on"));$("#bPlay").textContent=t.play};
  const start=()=>{beat=0;tick();timer=setInterval(tick,60000/bpm);$("#bPlay").textContent=t.stop};
  $("#bPlay").onclick=()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume&&ctx.resume()}catch(e){ctx=null}timer?stop():start()};
  const set=d=>{bpm=Math.min(240,Math.max(30,bpm+d));upd();if(timer){clearInterval(timer);timer=setInterval(tick,60000/bpm)}};
  $("#bDn").onclick=()=>set(-2);$("#bUp").onclick=()=>set(2);
  metro=stop;
}

function wireTuner(){
  let idx=1,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frame=now=>{const s=STRINGS[idx],e=(now-t0)/1000,c=reduce?-2:Math.round(14*Math.exp(-e/2.2)*Math.cos(e*1.7)-1);
    $("#needle").style.transform=`rotate(${c*1.8}deg)`;
    $("#tHz").textContent=`${(s[1]*Math.pow(2,c/1200)).toFixed(1)} Hz · ${c>0?"+":c<0?"−":"±"}${Math.abs(c)} cents`;
    const ok=Math.abs(c)<=3;$("#tState").textContent=ok?"In tune":c<0?"Tune up ↑":"Tune down ↓";$("#tState").classList.toggle("ok",ok);
    tunerRAF=requestAnimationFrame(frame)};
  $("#strs").onclick=e=>{const b=e.target.closest(".str");if(!b)return;idx=+b.dataset.i;t0=performance.now();
    document.querySelectorAll(".str").forEach(x=>x.classList.toggle("sel",x===b));$("#tNote").textContent=STRINGS[idx][0]};
  tunerRAF=requestAnimationFrame(frame);
}

function render(){
  const t=THEMES[cur];
  if(metro)metro();cancelAnimationFrame(tunerRAF);
  document.documentElement.style.setProperty("--page",t.page[0]);document.documentElement.style.setProperty("--page-2",t.page[1]);
  document.querySelectorAll(".haven").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===cur));
  $("#tname").textContent=t.name;$("#tdesc").textContent=t.desc;
  const el=$("#screens");el.className="screens t-"+cur;el.innerHTML=screens(cur,t);
  wireMetronome(t);wireTuner();drawChord("C");
  $("#cGrid").onclick=e=>{const b=e.target.closest(".chord");if(!b)return;document.querySelectorAll(".chord").forEach(x=>x.classList.toggle("sel",x===b));drawChord(b.dataset.c)};
  $("#plan").onclick=e=>{const b=e.target.closest(".chk");if(b)b.setAttribute("aria-checked",b.getAttribute("aria-checked")!=="true")};
  el.onclick=e=>{const g=e.target.closest("[data-go]");if(g)document.getElementById("p-"+g.dataset.go).closest(".col").scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})};
}
havens();render();
</script>
